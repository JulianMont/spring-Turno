<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Ubicación</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<!-- Navbar -->
	  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
	      <div class="container-fluid">
	          <a class="navbar-brand text-white fw-semibold" th:href="@{/home/index}"
	             onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
	              Sistema de Turnos
	          </a>

	          <div class="d-flex align-items-center ms-auto gap-3">
	              <div class="dropdown">
	                  <button class="btn btn-primary dropdown-toggle d-flex align-items-center gap-2 fw-semibold"
	                          type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
	                          onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
	                      <i class="bi bi-person-circle fs-4"></i>
	                      <span sec:authentication="name"></span>
	                  </button>

	                  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
	                      <li class="px-3 py-2">
	                          <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
	                              <button type="submit" class="btn btn-danger btn-sm rounded w-100">
	                                  Cerrar sesión
	                              </button>
	                          </form>
	                      </li>
	                  </ul>
	              </div>
	          </div>
	      </div>
	  </nav>
<div class="container mt-5">
    <h2 class="mb-4">Crear Nueva Ubicación</h2>

    <!-- Mensaje global de error -->
    <div th:if="${errorMensaje}" class="alert alert-danger" role="alert" th:text="${errorMensaje}"></div>

    <form th:action="@{/ubicaciones/form}" th:object="${ubicacionRequestDTO}" method="post" novalidate>
        <div class="mb-3">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" id="direccion" th:field="*{direccion}" class="form-control" placeholder="Ej: Direccion..." required>
            <div class="text-danger" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
        </div>

        <div class="mb-3">
            <label for="ciudad" class="form-label">Ciudad</label>
            <input type="text" id="ciudad" th:field="*{ciudad}" class="form-control" placeholder="Ciudad..." required>
            <div class="text-danger" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Ubicación</button>
        <a th:href="@{/ubicaciones/list}" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>

<!-- Bootstrap JS (opcional para interacciones) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
