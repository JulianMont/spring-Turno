<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Ubicaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<!-- Navbar -->
	  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
	      <div class="container-fluid">
	          <a class="navbar-brand text-white fw-semibold" th:href="@{/home/index}"
	             onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
	              Sistema de Turnos
	          </a>

	          <div class="d-flex align-items-center ms-auto gap-3">
	              <div class="dropdown">
	                  <button class="btn btn-primary dropdown-toggle d-flex align-items-center gap-2 fw-semibold"
	                          type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
	                          onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
	                      <i class="bi bi-person-circle fs-4"></i>
	                      <span sec:authentication="name"></span>
	                  </button>

	                  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
	                      <li class="px-3 py-2">
	                          <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
	                              <button type="submit" class="btn btn-danger btn-sm rounded w-100">
	                                  Cerrar sesión
	                              </button>
	                          </form>
	                      </li>
	                  </ul>
	              </div>
	          </div>
	      </div>
	  </nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">📍 Ubicaciones Registradas</h2>
		<div class="d-flex gap-2">
		        <a th:href="@{/ubicaciones/form}" class="btn btn-success">Nueva Ubicación</a>
		        <a th:href="@{/home/index}" class="btn btn-secondary">Volver al inicio</a>
		    </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ubicacion : ${ubicaciones}">
                        <td th:text="${ubicacion.id}">1</td>
                        <td th:text="${ubicacion.direccion}"></td>
                        <td th:text="${ubicacion.ciudad}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
