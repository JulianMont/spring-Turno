<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clientes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1 class="mb-4">Lista de Clientes</h1>

    <a th:href="@{/cliente/guardar}" class="btn btn-success mb-3">Agregar nuevo cliente</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.dni}">DNI</td>
            <td th:text="${cliente.nombre}">Nombre</td>
            <td th:text="${cliente.apellido}">Apellido</td>
            <td>
                <a th:href="@{/cliente/editar/{id}(id=${cliente.idPersona})}" class="btn btn-primary btn-sm me-1">Editar</a>
                <a th:href="@{/cliente/eliminar/{id}(id=${cliente.idPersona})}" 
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que desea eliminar este cliente?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/home/index}" class="btn btn-secondary mt-3">Volver al Inicio</a>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
