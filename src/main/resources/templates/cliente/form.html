<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-semibold" th:href="@{/home/index}"
               onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
                Sistema de Turnos
            </a>

            <div class="d-flex align-items-center ms-auto gap-3">
                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle d-flex align-items-center gap-2 fw-semibold"
                            type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                            onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
                        <i class="bi bi-person-circle fs-4"></i>
                        <span sec:authentication="name"></span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li class="px-3 py-2">
                            <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="btn btn-danger btn-sm rounded w-100">
                                    Cerrar sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4 flex-grow-1">

        <!-- Botón volver -->
        <div class="mb-3">
            <a class="btn btn-secondary" th:href="@{/cliente/list}">
                <i class="bi bi-arrow-left-circle me-1"></i> Volver a la lista de clientes
            </a>
        </div>

        <!-- Mensajes de error -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>
        <div th:if="${errorDni}" class="alert alert-danger">
            <p th:text="${errorDni}"></p>
        </div>

        <h1 class="mb-4 text-center" th:text="${cliente.idPersona == null} ? 'Nuevo Cliente' : 'Editar Cliente'"></h1>

        <!-- Formulario reducido -->
        <div class="d-flex justify-content-center">
            <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post" 
                  class="card p-4 shadow-sm w-100" style="max-width: 600px;">
                
                <!-- Campo oculto para ID -->
                <input type="hidden" th:field="*{idPersona}" />

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" th:field="*{user.email}" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('user.email')}" th:errors="*{user.email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" id="password" th:field="*{user.password}" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('user.password')}" th:errors="*{user.password}"></div>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido:</label>
                    <input type="text" id="apellido" th:field="*{apellido}" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                </div>

                <div class="mb-3">
                    <label for="dni" class="form-label">DNI:</label>
                    <input type="number" id="dni" th:field="*{dni}" class="form-control"/>
                    <div class="text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <a th:href="@{/cliente/list}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
