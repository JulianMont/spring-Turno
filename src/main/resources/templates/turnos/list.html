<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Listado de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pikaday/css/pikaday.css">
    <script src="https://cdn.jsdelivr.net/npm/pikaday/pikaday.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-semibold" th:href="@{/home/index}"
                onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
                Sistema de Turnos
            </a>
            <div class="d-flex align-items-center ms-auto gap-3">
                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle d-flex align-items-center gap-2 fw-semibold"
                        type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                        onmouseover="this.style.color='#ffc107'" onmouseout="this.style.color='white'">
                        <i class="bi bi-person-circle fs-4"></i>
                        <span sec:authentication="name"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li class="px-3 py-2">
                            <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="btn btn-danger btn-sm rounded w-100">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mt-4 flex-grow-1">

        <div class="mb-3 d-flex justify-content-start">
            <a class="btn btn-secondary" th:href="@{/home/index}">
                <i class="bi bi-arrow-left-circle me-1"></i> Regresar al Inicio
            </a>
        </div>

        <h1 class="mb-4 text-center">Listado de Turnos</h1>

        <div th:if="${mensaje}" class="alert alert-success" role="alert">
            <span th:text="${mensaje}"></span>
        </div>

        <form method="get" th:action="@{/turnos/list}" class="row g-3 align-items-center mb-4">

            <div class="col-md-3">
                <label for="clienteId" class="form-label">Cliente:</label>
                <select id="clienteId" name="clienteId" class="form-select form-select-sm">
                    <option value="">-- Seleccione Cliente --</option>
                    <th:block th:each="cliente : ${clientes}">
                        <option th:value="${cliente.idPersona}" th:text="${cliente.getNombreCompleto()}"></option>
                    </th:block>
                </select>
            </div>

            <div class="col-md-3">
                <label for="empleadoId" class="form-label">Empleado:</label>
                <select id="empleadoId" name="empleadoId" class="form-select form-select-sm">
                    <option value="">-- Seleccione Empleado --</option>
                    <th:block th:each="empleado : ${empleados}">
                        <option th:value="${empleado.idPersona}" th:text="${empleado.getNombreCompleto()}"></option>
                    </th:block>
                </select>
            </div>

            <div class="col-md-3">
                <label for="servicioId" class="form-label">Servicio:</label>
                <select id="servicioId" name="servicioId" class="form-select form-select-sm">
                    <option value="">-- Seleccione Servicio --</option>
                    <option th:each="servicio : ${servicios}" th:value="${servicio.id}" th:text="${servicio.nombre}"
                        th:selected="${servicio.id == servicioId}">Servicio</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="fecha" class="form-label">Día:</label>
                <input type="text" id="fecha" name="fecha" th:value="${fecha}" placeholder="Seleccionar fecha"
                    class="form-control form-control-sm" />
            </div>

            <div class="col-12 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
            </div>

        </form>

        <hr />

        <div class="table-responsive">
            <table class="table table-bordered table-hover table-striped align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>ID Turno</th>
                        <th>Cliente</th>
                        <th>Empleado</th>
                        <th>Servicio</th>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Estado</th>
                        <th style="width: 130px;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="turno : ${turnos}">
                        <td th:text="${turno.idTurno}">ID</td>
                        <td th:text="${turno.clienteNombre}">Cliente</td>
                        <td th:text="${turno.empleadoNombre}">Empleado</td>
                        <td th:text="${turno.servicioNombre}">Servicio</td>
                        <td th:text="${#temporals.format(turno.dia, 'dd/MM/yyyy')}">Día</td>
                        <td th:text="${#temporals.format(turno.hora, 'HH:mm')}">Hora</td>
                        <td th:text="${turno.estado}">Estado</td>
                        <td>
                            <form th:action="@{/turnos/editar/{id}(id=${turno.idTurno})}" method="get" style="display:inline;">
                                <button type="submit" class="btn btn-primary btn-sm">Editar</button>
                            </form>
                            <form th:action="@{/turnos/cancelar/{id}(id=${turno.idTurno})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que desea cancelar este turno?');">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Pikaday({
                field: document.getElementById('fecha'),
                format: 'YYYY-MM-DD',
                minDate: new Date(),
                disableWeekends: true
            });
        });
    </script>

</body>
</html>
